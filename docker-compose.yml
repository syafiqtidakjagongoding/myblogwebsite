version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./blog.db:/app/blog.db
    environment:
      - DB_PATH=/app/blog.db
      - NUXT_PUBLIC_BASE_URL=${NUXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NUXT_SMTP_HOST=${NUXT_SMTP_HOST}
      - NUXT_SMTP_PORT=${NUXT_SMTP_PORT}
      - NUXT_SMTP_USER=${NUXT_SMTP_USER}
      - NUXT_SMTP_PASS=${NUXT_SMTP_PASS}
      - NUXT_SMTP_TO=${NUXT_SMTP_TO}
      - NUXT_MINIO_ENDPOINT=${NUXT_MINIO_ENDPOINT:-localhost:9000}
      - NUXT_MINIO_BUCKET=${NUXT_MINIO_BUCKET:-myblog}
      - NUXT_MINIO_PUBLIC_URL=${NUXT_MINIO_PUBLIC_URL:-http://localhost:9000}
      - NUXT_MINIO_USE_SSL=${NUXT_MINIO_USE_SSL:-false}
      - NUXT_MINIO_USER=${MINIO_USER:-minio}
      - NUXT_MINIO_PASSWORD=${MINIO_PASSWORD:-changeme321}
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: minio-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme321}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  miniodata:
